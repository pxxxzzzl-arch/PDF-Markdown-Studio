name: Windows desktop release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create or update a GitHub Release after the build
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag (blank uses v<project-version>)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Windows 2022 / x64 / Full
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve release metadata
        id: metadata
        shell: pwsh
        env:
          REQUESTED_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          $version = (
            python -c "import sys; sys.path.insert(0, 'src'); import pdfmd; print(pdfmd.__version__)"
          ).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw "Unable to resolve the project version."
          }
          $releaseTag = $env:REQUESTED_RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            $releaseTag = "v$version"
          }
          if (
            "${{ github.event_name }}" -eq "push" -and
            "${{ github.ref_name }}" -ne "v$version"
          ) {
            throw "Tag ${{ github.ref_name }} does not match project version v$version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT

      - name: Build web frontend
        shell: pwsh
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build -- --mode desktop

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -e ".[dev]"

      - name: Run Python tests and lint
        shell: pwsh
        run: |
          python -m pytest -q --timeout=90
          python -m ruff check src tests scripts

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Full portable ZIP and installer
        shell: pwsh
        run: |
          & .\scripts\build_windows_app.ps1 -Edition full -Python python

      - name: Verify release asset names
        shell: pwsh
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $expected = @(
            "dist\windows\PDF-Markdown-Studio-$env:VERSION-Windows-x64-Portable.zip",
            "dist\windows\PDF-Markdown-Studio-$env:VERSION-Windows-x64-Setup.exe",
            "dist\windows\PDF-Markdown-Studio-$env:VERSION-Windows-x64-SHA256SUMS.txt"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing release asset: $path"
            }
            if ((Get-Item -LiteralPath $path).Length -ge 2GB) {
              throw "Release asset is not smaller than 2 GiB: $path"
            }
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PDF-Markdown-Studio-${{ steps.metadata.outputs.version }}-Windows-x64
          path: |
            dist/windows/PDF-Markdown-Studio-${{ steps.metadata.outputs.version }}-Windows-x64-Portable.zip
            dist/windows/PDF-Markdown-Studio-${{ steps.metadata.outputs.version }}-Windows-x64-Setup.exe
            dist/windows/PDF-Markdown-Studio-${{ steps.metadata.outputs.version }}-Windows-x64-SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "PDF Markdown Studio $env:VERSION" `
              --generate-notes
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to create release $env:RELEASE_TAG."
            }
          }
          gh release upload $env:RELEASE_TAG `
            "dist/windows/PDF-Markdown-Studio-$env:VERSION-Windows-x64-Portable.zip" `
            "dist/windows/PDF-Markdown-Studio-$env:VERSION-Windows-x64-Setup.exe" `
            "dist/windows/PDF-Markdown-Studio-$env:VERSION-Windows-x64-SHA256SUMS.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to upload Windows release assets."
          }
